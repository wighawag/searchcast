name: test

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format and build
        run: pnpm format:check && pnpm build

      # The native transport tests need libcurl-impersonate: install the
      # release pinned in LIBCURL_IMPERSONATE (packages/searchcast/src/libcurl.ts)
      # with `serpcast install-libcurl` itself (which verifies its checksum),
      # into a temporary data directory, and point the tests at it. The
      # plain-libcurl tests use the runner's system libcurl. Locally, without
      # these variables, those tests are skipped with a message.
      - name: Install pinned libcurl-impersonate
        run: |
          lib="$(XDG_DATA_HOME="$RUNNER_TEMP/xdg" node packages/searchcast/dist/cli.js install-libcurl)"
          echo "SERPCAST_LIBCURL_PATH=$lib" >> "$GITHUB_ENV"
          plain=/usr/lib/x86_64-linux-gnu/libcurl.so.4
          test -e "$plain"
          echo "SERPCAST_TEST_PLAIN_LIBCURL=$plain" >> "$GITHUB_ENV"

      # With the build above, the same gate as `verify` in dorfl.json.
      # The browser tests (packages/browser) drive the runner's preinstalled
      # Google Chrome against a local fixture site. --no-sandbox because
      # Ubuntu's AppArmor policy blocks the unprivileged user namespaces
      # Chrome's sandbox wants; the runner is disposable and the browser only
      # ever loads the fixture.
      - name: Test
        run: pnpm test
        env:
          SEARCHCAST_CHROME: /usr/bin/google-chrome
          SEARCHCAST_TEST_CHROME_ARGS: --no-sandbox
